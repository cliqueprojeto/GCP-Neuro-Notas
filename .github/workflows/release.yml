name: Release — GCP Notas
# A release é gerada quando chega um arquivo novo em docs/release-notes/vX.Y.Z.md
# (com a versão do package.json) ou manualmente pela aba Actions.
on:
  push:
    paths: ['docs/release-notes/**', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar a release ao final (desmarcado = fica como rascunho)
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  VITE_MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}

jobs:
  draft:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      version: ${{ steps.r.outputs.version }}
      skip: ${{ steps.r.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - name: Rascunho da release
        id: r
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)" = "false" ]; then
            echo "A versão $TAG já foi publicada; nada a fazer."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          NOTES="docs/release-notes/${TAG}.md"
          test -f "$NOTES" || NOTES=CHANGELOG.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existe; os arquivos serão substituídos."
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "GCP Notas ${VERSION}" --notes-file "$NOTES"
          fi

  build:
    needs: draft
    if: needs.draft.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: linux, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: 'deb,rpm' }
          - { id: windows, runner: windows-2022, target: x86_64-pc-windows-msvc, bundles: nsis }
          - { id: macos-arm64, runner: macos-15, target: aarch64-apple-darwin, bundles: dmg }
          - { id: macos-x86_64, runner: macos-15-intel, target: x86_64-apple-darwin, bundles: dmg }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.draft.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.id }}
      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev patchelf rpm file
      - name: Dependências e testes
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Build do aplicativo e instaladores
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Nomear instaladores e gerar SHA-256
        run: |
          B="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p out
          case "${{ matrix.id }}" in
            linux)
              cp "$(ls $B/deb/*.deb | head -1)" "out/gcp-notas_${VERSION}_amd64.deb"
              cp "$(ls $B/rpm/*.rpm | head -1)" "out/gcp-notas-${VERSION}-1.x86_64.rpm" ;;
            windows)
              cp "$(ls $B/nsis/*-setup.exe | head -1)" "out/GCP-Notas-${VERSION}-Windows-x64-Setup.exe" ;;
            macos-arm64)
              cp "$(ls $B/dmg/*.dmg | head -1)" "out/GCP-Notas-${VERSION}-macOS-arm64.dmg" ;;
            macos-x86_64)
              cp "$(ls $B/dmg/*.dmg | head -1)" "out/GCP-Notas-${VERSION}-macOS-x86_64.dmg" ;;
          esac
          cd out
          for f in *; do
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
          done
          ls -la
      - name: Testar instalação do .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y "./out/gcp-notas_${VERSION}_amd64.deb"
          test -x /usr/bin/gcp-notas
          desktop-file-validate /usr/share/applications/*.desktop || true
          sudo apt-get remove -y gcp-notas || true
      - name: Enviar ao rascunho da release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4; do
            gh release upload "${{ needs.draft.outputs.tag }}" --clobber out/* && break
            test "$attempt" -lt 4; sleep $((attempt * 15))
          done
      - uses: actions/upload-artifact@v4
        if: matrix.id == 'linux'
        with:
          name: linux-deb
          path: out/*.deb
          retention-days: 3

  android:
    needs: draft
    if: needs.draft.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.draft.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: SDK e NDK do Android (já instalados no runner)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          NDK="${ANDROID_NDK_LATEST_HOME:-$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)}"
          test -d "$NDK"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "$BT" >> "$GITHUB_PATH"
          echo "NDK: $NDK"; echo "build-tools: $BT"
          ls "$ANDROID_HOME/platforms"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android
      - name: Dependências e testes
        run: |
          npm ci
          npm test
      - name: Gerar projeto Android e ícones
        run: |
          npx tauri android init --ci
          npx tauri icon assets/branding/icon-1024.png
      - name: Compilar APK (arm64, armv7 e x86_64)
        run: npx tauri android build --apk --ci --target aarch64 armv7 x86_64
      - name: Assinar o APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK=$(find src-tauri/gen/android -name "*-release-unsigned.apk" | head -1)
          test -n "$APK"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
          else
            echo "::warning::Sem chave de assinatura nos segredos: usando uma chave temporária (para atualizar será preciso reinstalar). Veja docs/MOBILE.md."
            KS_PASS=temporaria123; KEY_PASS=temporaria123; KEY_ALIAS=gcpnotas
            keytool -genkeypair -v -keystore release.jks -storepass "$KS_PASS" -keypass "$KEY_PASS" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=GCP Notas, O=Gestao Cultural Pro, C=BR"
          fi
          mkdir -p out
          zipalign -p -f 4 "$APK" aligned.apk
          apksigner sign --v4-signing-enabled false --ks release.jks --ks-pass "pass:$KS_PASS" --key-pass "pass:${KEY_PASS:-$KS_PASS}" --ks-key-alias "$KEY_ALIAS" \
            --out "out/GCP-Notas-${VERSION}-Android.apk" aligned.apk
          apksigner verify --print-certs "out/GCP-Notas-${VERSION}-Android.apk" | head -3
          rm -f release.jks
          cd out && sha256sum "GCP-Notas-${VERSION}-Android.apk" > "GCP-Notas-${VERSION}-Android.apk.sha256" && ls -la
      - name: Enviar ao rascunho da release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4; do
            gh release upload "${{ needs.draft.outputs.tag }}" --clobber out/* && break
            test "$attempt" -lt 4; sleep $((attempt * 15))
          done

  arch:
    needs: [draft, build]
    if: needs.draft.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.draft.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: dist
      - name: Gerar pacote Arch (.pkg.tar.zst) no Arch Linux oficial
        run: |
          docker run --rm -e VERSION="$VERSION" -v "$PWD:/work" archlinux:base-devel bash /work/packaging/arch/build.sh
          sudo chown -R "$(id -u):$(id -g)" dist
          cd dist && sha256sum gcp-notas-bin-*.pkg.tar.zst > "$(ls gcp-notas-bin-*.pkg.tar.zst).sha256"
      - name: Enviar ao rascunho da release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.draft.outputs.tag }}" --clobber dist/*.pkg.tar.zst dist/*.pkg.tar.zst.sha256

  publish:
    needs: [draft, build, arch, android]
    if: needs.draft.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Conferir arquivos, gerar SHA256SUMS e publicar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
          V: ${{ needs.draft.outputs.version }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          SHA: ${{ github.sha }}
        run: |
          mkdir release
          gh release download "$TAG" --dir release --pattern '*'
          rm -f release/SHA256SUMS.txt
          for f in "GCP-Notas-$V-Windows-x64-Setup.exe" "GCP-Notas-$V-macOS-arm64.dmg" "GCP-Notas-$V-macOS-x86_64.dmg" \
                   "gcp-notas_${V}_amd64.deb" "gcp-notas-$V-1.x86_64.rpm" "gcp-notas-bin-$V-1-x86_64.pkg.tar.zst" \
                   "GCP-Notas-$V-Android.apk"; do
            test -s "release/$f"
            (cd release && sha256sum -c "$f.sha256")
          done
          (cd release && sha256sum $(ls | grep -v '\.sha256$') > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release upload "$TAG" --clobber release/SHA256SUMS.txt
          if [ "$PUBLISH" = "true" ]; then gh release edit "$TAG" --draft=false --latest; fi
