<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- GCP-Neuro Notas — ícone do app em todos os sistemas: folha de nota ligada a uma rede neural (Neuro Links), sobre fundo branco -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f8"/>
    </linearGradient>
    <linearGradient id="axon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="soma" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset=".5" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </radialGradient>
    <radialGradient id="soma2" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#99f6e4"/>
      <stop offset=".55" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0e7490"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f1b3d" flood-opacity=".16"/>
    </filter>
  </defs>

  <!-- base branca (squircle) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g transform="translate(512 512) scale(0.78) translate(-560 -510)">
  <g filter="url(#shadow)">
    <!-- folha de nota com canto dobrado -->
    <path d="M300 196 H560 L692 328 V716 Q692 776 632 776 H300 Q240 776 240 716 V256 Q240 196 300 196 Z" fill="#ffffff" stroke="#0f1b3d" stroke-width="32" stroke-linejoin="round"/>
    <path d="M560 196 V280 Q560 328 608 328 H692" fill="#e6edf7" stroke="#0f1b3d" stroke-width="32" stroke-linejoin="round"/>
    <!-- linhas de texto -->
    <path d="M318 412 H520" stroke="#0f1b3d" stroke-width="30" stroke-linecap="round"/>
    <path d="M318 494 H586" stroke="#0f1b3d" stroke-width="30" stroke-linecap="round" opacity=".55"/>
    <path d="M318 576 H440" stroke="#0f1b3d" stroke-width="30" stroke-linecap="round" opacity=".55"/>
  </g>

  <!-- rede neural: axônios (contorno branco para separar da folha) -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#ffffff" stroke-width="58">
      <path d="M470 576 C520 600 548 640 586 676"/>
      <path d="M586 676 C660 610 720 560 792 500"/>
      <path d="M586 676 C680 700 740 740 796 792"/>
      <path d="M792 500 C820 600 820 700 796 792"/>
    </g>
    <g stroke="url(#axon)" stroke-width="26">
      <path d="M470 576 C520 600 548 640 586 676"/>
      <path d="M586 676 C660 610 720 560 792 500"/>
      <path d="M586 676 C680 700 740 740 796 792"/>
      <path d="M792 500 C820 600 820 700 796 792"/>
    </g>
    <!-- dendritos -->
    <g stroke="#0ea5e9" stroke-width="16">
      <path d="M792 500 L858 430"/>
      <path d="M792 500 L874 520"/>
      <path d="M796 792 L870 846"/>
      <path d="M796 792 L846 724"/>
      <path d="M586 676 L548 770"/>
    </g>
  </g>

  <!-- neurônios -->
  <circle cx="586" cy="676" r="118" fill="url(#halo)"/>
  <circle cx="586" cy="676" r="66" fill="url(#soma)" stroke="#ffffff" stroke-width="16"/>
  <circle cx="570" cy="658" r="16" fill="#ffffff" opacity=".85"/>
  <circle cx="792" cy="500" r="46" fill="url(#soma2)" stroke="#ffffff" stroke-width="13"/>
  <circle cx="796" cy="792" r="50" fill="url(#soma)" stroke="#ffffff" stroke-width="13"/>
  <!-- sinapse na linha da nota -->
  <circle cx="460" cy="576" r="26" fill="#06b6d4" stroke="#ffffff" stroke-width="10"/>
  <!-- pontas dos dendritos -->
  <g fill="#0ea5e9">
    <circle cx="858" cy="430" r="13"/><circle cx="874" cy="520" r="13"/><circle cx="870" cy="846" r="13"/><circle cx="846" cy="724" r="12"/><circle cx="548" cy="770" r="13"/>
  </g>
  </g>
</svg>
