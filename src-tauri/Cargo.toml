[package]
name = "gcp-notas"
version = "1.7.0"
description = "GCP Notas"
authors = ["Bruno Albertini | Gestão Cultural Pro"]
license = "GPL-3.0-or-later"
repository = "https://github.com/cliqueprojeto/GCP-Neuro-Notas"
edition = "2021"
rust-version = "1.77"

[lib]
name = "gcp_notas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
tauri-plugin-notification = "2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls", "hostname"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
