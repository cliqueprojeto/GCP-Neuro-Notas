<text x="84" y="34" fill="#55516a">accounts.google.com — permissão de acesso</text>
<text x="34" y="96" fill="#1d1b26" font-weight="400" font-size="21">O app GCP-Notas quer</text><text x="34" y="122" fill="#1d1b26" font-weight="400" font-size="21">acessar sua Conta do</text><text x="34" y="148" fill="#1d1b26" font-weight="400" font-size="21">Google</text><rect x="300" y="60" width="310" height="52" rx="8" fill="#fdefd3"/><text x="312" y="82" fill="#7a4a00" font-weight="400" font-size="12">Este app não foi verificado pelo Google. Só</text><text x="312" y="98" fill="#7a4a00" font-weight="400" font-size="12">continue se conhecer o desenvolvedor.</text><text x="300" y="140" fill="#1d1b26" font-weight="600" font-size="13">Selecione o que o app GCP-Notas pode acessar</text><text x="300" y="170" fill="#55516a" font-weight="400" font-size="13">Ver, criar e excluir os dados do próprio</text><text x="300" y="188" fill="#55516a" font-weight="400" font-size="13">app no Google Drive (pasta oculta).</text><rect x="584" y="164" width="18" height="18" rx="4" fill="#6a3de8"/><path d="M588 173 l4 4 l7 -8" stroke="#ffffff" stroke-width="2.2" fill="none"/><rect x="579" y="159" width="28" height="28" rx="10" fill="none" stroke="#e0457b" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="579" cy="159" r="11" fill="#e0457b"/><text x="579" y="163.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><line x1="300" y1="206" x2="610" y2="206" stroke="#d9d5e6"/><text x="300" y="228" fill="#686478" font-weight="400" font-size="12">Sem a caixa marcada, o GCP-Notas não consegue salvar o backup.</text><rect x="300" y="262" width="140" height="32" rx="16.0" fill="#ffffff" stroke="#c9c4da"/><text x="342.8" y="283.0" fill="#1d1b26" font-weight="600" font-size="13">Cancelar</text><rect x="460" y="262" width="140" height="32" rx="16.0" fill="#ffffff" stroke="#c9c4da"/><text x="499.4" y="283.0" fill="#1d1b26" font-weight="600" font-size="13">Continuar</text><rect x="455" y="257" width="150" height="42" rx="10" fill="none" stroke="#e0457b" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="455" cy="257" r="11" fill="#e0457b"/><text x="455" y="261.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
