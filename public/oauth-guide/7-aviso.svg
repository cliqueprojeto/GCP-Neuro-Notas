<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="accounts.google.com — aviso do Google" font-family="Segoe UI, system-ui, sans-serif" font-size="13">
<rect width="640" height="300" rx="12" fill="#f5f4f9"/>
<rect x="12" y="12" width="616" height="276" rx="10" fill="#ffffff" stroke="#d9d5e6"/>
<rect x="12" y="12" width="616" height="34" rx="10" fill="#ebe8f3"/>
<circle cx="30" cy="29" r="5" fill="#c9c4da"/><circle cx="46" cy="29" r="5" fill="#c9c4da"/><circle cx="62" cy="29" r="5" fill="#c9c4da"/>
<text x="84" y="34" fill="#55516a">accounts.google.com — aviso do Google</text>
<path d="M50 70 l16 28 h-32 z" fill="#e9a0a0"/><text x="50" y="94" text-anchor="middle" font-weight="700" fill="#7a1c1c">!</text><text x="34" y="138" fill="#1d1b26" font-weight="400" font-size="21">O Google não verificou</text><text x="34" y="164" fill="#1d1b26" font-weight="400" font-size="21">este app</text><text x="300" y="78" fill="#55516a" font-weight="400" font-size="13">O app está pedindo acesso a algumas informações</text><text x="300" y="96" fill="#55516a" font-weight="400" font-size="13">sensíveis na sua Conta do Google.</text><text x="300" y="128" fill="#6a3de8" font-weight="600" font-size="13">Avançado</text><rect x="291" y="107" width="80" height="34" rx="10" fill="none" stroke="#e0457b" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="291" cy="107" r="11" fill="#e0457b"/><text x="291" y="111.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><rect x="300" y="150" width="310" height="78" rx="10" fill="#fbe4e2"/><text x="314" y="174" fill="#7a1c1c" font-weight="400" font-size="12">Continue apenas se você entender os riscos e</text><text x="314" y="190" fill="#7a1c1c" font-weight="400" font-size="12">confiar no desenvolvedor (seu-email@gmail.com).</text><text x="314" y="214" fill="#7a1c1c" font-weight="700" text-decoration="underline">Acessar GCP-Neuro Notas (não seguro)</text><rect x="305" y="193" width="215" height="32" rx="10" fill="none" stroke="#e0457b" stroke-width="2.5" stroke-dasharray="6 4"/><circle cx="305" cy="193" r="11" fill="#e0457b"/><text x="305" y="197.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><rect x="470" y="244" width="140" height="30" rx="15.0" fill="#ffffff" stroke="#c9c4da"/><text x="478.8" y="264.0" fill="#1d1b26" font-weight="600" font-size="13">Voltar à segurança</text>
</svg>
