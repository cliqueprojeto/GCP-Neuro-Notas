<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- GCP-Neuro Notas — folha de nota com um cérebro de conexões neurais -->
  <defs>
    <radialGradient id="bg" cx="30%" cy="22%" r="95%">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="0.45" stop-color="#3b1585"/>
      <stop offset="1" stop-color="#0b0a2e"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#7c3aed" stop-opacity=".1"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e4ff"/>
    </linearGradient>
    <linearGradient id="syn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <radialGradient id="gold" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset=".45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#05041a" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="none" stroke="url(#rim)" stroke-width="10"/>
  <!-- brilho suave -->
  <ellipse cx="380" cy="230" rx="360" ry="190" fill="#a78bfa" opacity=".16"/>

  <!-- folha de nota com canto dobrado -->
  <g filter="url(#sh)">
    <path d="M300 218h330l146 146v410a52 52 0 0 1-52 52H300a52 52 0 0 1-52-52V270a52 52 0 0 1 52-52z" fill="url(#page)"/>
    <path d="M630 218v104a42 42 0 0 0 42 42h104z" fill="#c4b5fd"/>
  </g>

  <!-- cérebro feito de sinapses -->
  <g fill="none" stroke="url(#syn)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 400c-40-46-128-40-150 24-52 6-74 68-44 108-30 44 0 106 56 106 18 50 96 62 138 18"/>
    <path d="M512 400c40-46 128-40 150 24 52 6 74 68 44 108 30 44 0 106-56 106-18 50-96 62-138 18"/>
    <path d="M512 400v256"/>
    <path d="M512 480l-86-26M512 480l86-26M512 568l-104 18M512 568l104 18" stroke-width="16" opacity=".9"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="426" cy="454" r="22" fill="#22d3ee"/>
    <circle cx="598" cy="454" r="22" fill="#e879f9"/>
    <circle cx="408" cy="586" r="22" fill="#8b5cf6"/>
    <circle cx="616" cy="586" r="22" fill="#a855f7"/>
    <circle cx="512" cy="400" r="24" fill="#22d3ee"/>
    <circle cx="512" cy="660" r="24" fill="#e879f9"/>
  </g>
  <!-- centelha dourada (a ideia) -->
  <g filter="url(#glow)">
    <circle cx="512" cy="526" r="38" fill="url(#gold)"/>
  </g>
  <circle cx="500" cy="514" r="11" fill="#fffbeb" opacity=".9"/>
</svg>
